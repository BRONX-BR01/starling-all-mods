name: build-native
on:
  workflow_dispatch:
    inputs:
      starling_ref:
        description: Tag ou commit do Starling
        default: test-0.8.1-1
      mods:
        description: ids separados por espaco (vazio = todos os nativos)
        required: false
      batch_size:
        description: mods por lote (1 = isola cada mod)
        default: '10'
      full_apk:
        description: Gerar o APK com os mods dentro (mais lento)
        default: 'false'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.p.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          MODS: ${{ inputs.mods }}
          BATCH: ${{ inputs.batch_size }}
        run: python3 scripts/plan.py

  build:
    needs: plan
    if: needs.plan.outputs.batches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    env:
      NATIVE_CACHE: ${{ github.workspace }}/../native-cache
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { path: tools, persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: starling-client/starling
          ref: ${{ inputs.starling_ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Android SDK e NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
      - name: Rust e cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
      - name: Swap
        run: |
          sudo swapoff -a || true
          where=/mnt size=20G
          avail=$(df --output=avail -BG "$where" 2>/dev/null | tail -1 | tr -dc 0-9)
          if [ "${avail:-0}" -lt 30 ]; then where=$RUNNER_TEMP size=10G; fi
          sudo fallocate -l "$size" "$where/release.swap"
          sudo chmod 600 "$where/release.swap"
          sudo mkswap "$where/release.swap" > /dev/null
          sudo swapon "$where/release.swap"
          echo "CARGO_BUILD_JOBS=3" >> "$GITHUB_ENV"
      - name: Build
        env:
          IDS: ${{ matrix.batch.ids }}
          NAME: ${{ matrix.batch.name }}
          FULL_APK: ${{ inputs.full_apk }}
        run: python3 tools/scripts/build_batch.py "$NAME" $IDS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.batch.name }}
          path: |
            result.json
            build.log
            out/*.so
            out/*.json
          retention-days: 14

  report:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: res, pattern: 'result-*' }
      - name: Resumo
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, glob
          rs = [json.load(open(p)) for p in sorted(glob.glob("res/*/result.json"))]
          print("| lote | status | mods |\n|---|---|---|")
          for r in rs: print(f'| {r["batch"]} | {r["status"]} | {" ".join(r["ids"])} |')
          for r in rs:
              if r["status"] != "ok":
                  print(f'\n### {r["batch"]} ({r["status"]})\n```\n' + "\n".join(r["tail"][-15:]) + "\n```")
          PY
      - name: Publicar os .so
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(res/*/out/*.so res/*/out/*.json res/*/out/*.apk)
          [ ${#files[@]} -gt 0 ] || exit 0
          tag="builds-${{ github.run_id }}"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease \
            --title "Builds $tag" --notes "Starling ${{ inputs.starling_ref }}" "${files[@]}"
